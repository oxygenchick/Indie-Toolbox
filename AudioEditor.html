                container.appendChild(div);

                const canvas = document.getElementById(`canvas-${track.id}`);
                drawWaveform(canvas, track);
                setupDragHandles(track.id, canvas);
                updateTrackPlayButton(track.id);
            });

            if (tracks.length && (!focusedTrackId || !tracks.some(t => t.id === focusedTrackId))) {
                focusedTrackId = tracks[0].id;
            }

            renderGlobalTimeline();
        }

        function drawWaveform(canvas, track, playPercent = null) {
            const ctx = canvas.getContext('2d');
            const w = canvas.width, h = canvas.height;
            ctx.clearRect(0, 0, w, h);

            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, w, h);

            if (!track.buffer) return;

            const { viewStart, viewEnd, viewDur } = getTrackViewRange(track);
            const data = track.buffer.getChannelData(0);

            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let x = 0; x < w; x++) {
                const t0 = viewStart + (x / w) * viewDur;
                const t1 = viewStart + ((x + 1) / w) * viewDur;
                const from = Math.max(0, Math.floor(t0 * data.length / track.duration));
                const to = Math.min(data.length, Math.ceil(t1 * data.length / track.duration));
                if (from >= data.length) break;
                let minv = 1, maxv = -1;
                for (let i = from; i < to; i++) {
                    const v = data[i];
                    if (v < minv) minv = v;
                    if (v > maxv) maxv = v;
                }
                if (minv > maxv) continue;
                ctx.moveTo(x, h / 2 * (1 + minv));
                ctx.lineTo(x, h / 2 * (1 + maxv));
            }
            ctx.stroke();

            const startPx = timeToCanvasX(track.trimStart, track, w);
            const endPx = timeToCanvasX(track.trimEnd, track, w);
            const fadeInEndPx = timeToCanvasX(track.trimStart + track.fadeInDuration, track, w);
            const fadeOutStartPx = timeToCanvasX(track.trimEnd - track.fadeOutDuration, track, w);

            ctx.save();
            ctx.globalAlpha = 0.12;
            ctx.fillStyle = '#000';
            const selLeft = Math.max(0, Math.min(startPx, endPx));
            const selRight = Math.min(w, Math.max(startPx, endPx));
            if (selRight > selLeft) ctx.fillRect(selLeft, 0, selRight - selLeft, h);
            ctx.restore();

            const sel = waveformSelections.get(track.id);
            if (sel) {
                const s0 = Math.min(sel.start, sel.end);
                const s1 = Math.max(sel.start, sel.end);
                const sx0 = timeToCanvasX(s0, track, w);
                const sx1 = timeToCanvasX(s1, track, w);
                if (sx1 > 0 && sx0 < w) {
                    ctx.save();
                    ctx.globalAlpha = 0.25;
                    ctx.fillStyle = '#0066cc';
                    ctx.fillRect(Math.max(0, sx0), 0, Math.min(w, sx1) - Math.max(0, sx0), h);
                    ctx.restore();
                }
            }

            ctx.strokeStyle = '#000';
            ctx.lineWidth = 4;
            ctx.beginPath();
            if (track.trimStart >= viewStart && track.trimStart <= viewEnd) {
                ctx.moveTo(startPx, 0); ctx.lineTo(startPx, h);
            }
            if (track.trimEnd >= viewStart && track.trimEnd <= viewEnd) {
                ctx.moveTo(endPx, 0); ctx.lineTo(endPx, h);
            }
            ctx.stroke();

            if (track.fadesEnabled !== false) {
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.setLineDash([6, 4]);
                ctx.beginPath();
                const fiEnd = track.trimStart + track.fadeInDuration;
                const foStart = track.trimEnd - track.fadeOutDuration;
                if (fiEnd >= viewStart && fiEnd <= viewEnd) {
                    ctx.moveTo(fadeInEndPx, 0); ctx.lineTo(fadeInEndPx, h);
                }
                if (foStart >= viewStart && foStart <= viewEnd) {
                    ctx.moveTo(fadeOutStartPx, 0); ctx.lineTo(fadeOutStartPx, h);
                }
                ctx.stroke();
                ctx.setLineDash([]);

                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(startPx, h);
                ctx.lineTo(fadeInEndPx, 0);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(fadeOutStartPx, 0);
                ctx.lineTo(endPx, h);
                ctx.stroke();
            }

            const ph = playPercent !== null ? playPercent : (trackPlayheadPos.get(track.id) || 0);
            const playTime = track.trimStart + (track.trimEnd - track.trimStart) * ph;
            if (playTime >= viewStart && playTime <= viewEnd) {
                const playPx = timeToCanvasX(playTime, track, w);
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 3;
                ctx.setLineDash([2, 2]);
                ctx.beginPath();
                ctx.moveTo(playPx, 0); ctx.lineTo(playPx, h);
                ctx.stroke();
                ctx.setLineDash([]);

                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.moveTo(playPx - 6, 0);
                ctx.lineTo(playPx + 6, 0);
                ctx.lineTo(playPx, 10);
                ctx.closePath();
                ctx.fill();
            }
        }

        function setupDragHandles(trackId, canvas) {
            let dragMode = null;
            let dragMoved = false;
            let dragUndoPushed = false;
            let panStartMx = 0;
            let panOrigScroll = 0;
            const track = tracks.find(t => t.id === trackId);

            const getHandlePositions = (cssW) => {
                const positions = {
                    trimStart: timeToCanvasX(track.trimStart, track, cssW),
                    trimEnd: timeToCanvasX(track.trimEnd, track, cssW)
                };
                if (track.fadesEnabled !== false) {
                    positions.fadeInEnd = timeToCanvasX(track.trimStart + track.fadeInDuration, track, cssW);
                    positions.fadeOutStart = timeToCanvasX(track.trimEnd - track.fadeOutDuration, track, cssW);
                }
                return positions;
            };

            const getPlayheadX = (cssW) => {
                const ph = activeTrackPlayers.has(trackId)
                    ? getTrackPlayPercent(trackId)
                    : (trackPlayheadPos.get(trackId) || 0);
                const playTime = track.trimStart + (track.trimEnd - track.trimStart) * ph;
                return timeToCanvasX(playTime, track, cssW);
            };

            const isPlayheadHeadGrab = (clickX, clickY, cssW) => {
                const playPx = getPlayheadX(cssW);
                const { viewStart, viewEnd } = getTrackViewRange(track);
                const ph = activeTrackPlayers.has(trackId) ? getTrackPlayPercent(trackId) : (trackPlayheadPos.get(trackId) || 0);
                const playTime = track.trimStart + (track.trimEnd - track.trimStart) * ph;
                if (playTime < viewStart || playTime > viewEnd) return false;
                return clickY <= 14 && Math.abs(clickX - playPx) <= 10;
            };

            const nearestHandle = (clickX, cssW) => {
                const positions = getHandlePositions(cssW);
                let minDist = Infinity;
                let type = null;
                for (const key in positions) {
                    const dist = Math.abs(clickX - positions[key]);
                    if (dist < minDist) {
                        minDist = dist;
                        type = key;
                    }
                }
                return minDist <= 25 ? type : null;
            };

            const redraw = () => {
                const ph = activeTrackPlayers.has(trackId) ? getTrackPlayPercent(trackId) : (trackPlayheadPos.get(trackId) || 0);
                drawWaveform(canvas, track, ph);
            };

            canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                setFocusedTrack(trackId);
                const rect = canvas.getBoundingClientRect();
                const mx = e.clientX - rect.left;
                const mouseTime = canvasXToTime(mx, track, rect.width);
                const vs = getTrackViewState(trackId);
                if (e.ctrlKey || e.metaKey || Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
                    const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
                    vs.scroll = mouseTime - (mouseTime - vs.scroll) * (vs.zoom / Math.max(1, Math.min(64, vs.zoom * factor)));
                    vs.zoom = Math.max(1, Math.min(64, vs.zoom * factor));
                } else {
                    vs.scroll += (e.deltaX / rect.width) * (track.duration / vs.zoom);
                }
                clampTrackViewScroll(track);
                redraw();
            }, { passive: false });

            canvas.addEventListener('mousedown', (e) => {
                setFocusedTrack(trackId);
                const rect = canvas.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const clickY = e.clientY - rect.top;
                dragMoved = false;

                if (isPlayheadHeadGrab(clickX, clickY, rect.width)) {
                    dragMode = 'playhead';
                    canvas.classList.add('is-playhead-grab');
                    e.preventDefault();
                    return;
                }

                dragMode = nearestHandle(clickX, rect.width);
                if (dragMode) {
                    pushUndo(handleUndoLabel(dragMode));
                    dragUndoPushed = true;
                    e.preventDefault();
                    return;
                }

                if (e.shiftKey) {
                    dragMode = 'select';
                    const t = canvasXToTime(clickX, track, rect.width);
                    waveformSelections.set(trackId, { start: t, end: t });
                    e.preventDefault();
                    return;
                }

                if (waveformSelections.has(trackId)) {
                    dragMode = 'clearSel';
                    e.preventDefault();
                    return;
                }

                const vs = getTrackViewState(trackId);
                if (vs.zoom > 1) {
                    dragMode = 'pan';
                    panStartMx = clickX;
                    panOrigScroll = vs.scroll;
                    canvas.classList.add('is-grabbing');
                    e.preventDefault();
                }
            });

            const onMove = (e) => {
                if (!dragMode) return;
                dragMoved = true;
                const rect = canvas.getBoundingClientRect();
                let clickX = Math.max(0, Math.min(rect.width, e.clientX - rect.left));
                const newTime = canvasXToTime(clickX, track, rect.width);

                if (dragMode === 'pan') {
                    const vs = getTrackViewState(trackId);
                    const { viewDur } = getTrackViewRange(track);
                    const dx = clickX - panStartMx;
                    vs.scroll = panOrigScroll - (dx / rect.width) * viewDur;
                    clampTrackViewScroll(track);
                    redraw();
                    return;
                }

                if (dragMode === 'playhead') {
                    const rel = Math.max(0, Math.min(1, (newTime - track.trimStart) / (track.trimEnd - track.trimStart)));
                    trackPlayheadPos.set(trackId, rel);
                    redraw();
                    return;
                }

                if (dragMode === 'select') {
                    const sel = waveformSelections.get(trackId);
                    if (sel) {
                        sel.end = newTime;
                        redraw();
                    }
                    return;
                }

                if (dragMode === 'clearSel') return;

                const halfDur = () => (track.trimEnd - track.trimStart) / 2;
                if (dragMode === 'trimStart') {
                    track.trimStart = Math.max(0, Math.min(newTime, track.trimEnd - 0.2));
                    clampFades(track);
                } else if (dragMode === 'trimEnd') {
                    track.trimEnd = Math.max(track.trimStart + 0.2, Math.min(newTime, track.duration));
                    clampFades(track);
                } else if (dragMode === 'fadeInEnd') {
                    track.fadeInDuration = Math.max(0, Math.min(newTime - track.trimStart, halfDur()));
                } else if (dragMode === 'fadeOutStart') {
                    track.fadeOutDuration = Math.max(0, Math.min(track.trimEnd - newTime, halfDur()));
                }

                redraw();
                syncTrackInputs(trackId, track);
            };

            const onUp = () => {
                if (!dragMode) return;
                canvas.classList.remove('is-grabbing', 'is-playhead-grab');

                if (dragMode === 'playhead' && dragMoved) {
                    const rel = trackPlayheadPos.get(trackId) || 0;
                    playTrack(trackId, rel * (track.trimEnd - track.trimStart));
                }

                if (dragMode === 'select') {
                    const sel = waveformSelections.get(trackId);
                    if (sel && Math.abs(sel.end - sel.start) < 0.02) waveformSelections.delete(trackId);
                }

                if (dragMode === 'clearSel' && !dragMoved) {
                    waveformSelections.delete(trackId);
                    redraw();
                }

                if (dragUndoPushed && !dragMoved) {
                    undoStack.pop();
                    updateUndoHint();
                }
                dragUndoPushed = false;

                if (dragMode && dragMode !== 'playhead' && dragMode !== 'select' && dragMode !== 'pan' && dragMode !== 'clearSel') {
                    renderGlobalTimeline(getMixPlayPercent());
                }

                dragMode = null;
            };

            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onUp);
        }

        function deleteSelectedRegion(trackId) {
            const track = tracks.find(t => t.id === trackId);
            const sel = waveformSelections.get(trackId);
            if (!track || !sel) return;

            let delStart = Math.max(track.trimStart, Math.min(sel.start, sel.end));
            let delEnd = Math.min(track.trimEnd, Math.max(sel.start, sel.end));
            if (delEnd - delStart < 0.05) return;

            pushUndo('audio.undoDeleteRegion');
            stopTrack(trackId);

            const oldTrimStart = track.trimStart;
            const oldTrimEnd = track.trimEnd;
            const oldFadeInEnd = oldTrimStart + track.fadeInDuration;
            const oldFadeOutStart = oldTrimEnd - track.fadeOutDuration;
            const delLen = delEnd - delStart;

            const buffer = track.buffer;
            const sr = buffer.sampleRate;
            const ch = buffer.numberOfChannels;
            const startS = Math.floor(delStart * sr);
            const endS = Math.floor(delEnd * sr);
            const newLen = buffer.length - (endS - startS);

            const ac = initAudioContext();
            const newBuffer = ac.createBuffer(ch, newLen, sr);
            for (let c = 0; c < ch; c++) {
                const src = buffer.getChannelData(c);
                const dst = newBuffer.getChannelData(c);
                dst.set(src.subarray(0, startS), 0);
                dst.set(src.subarray(endS), startS);
            }

            const remapTime = (t) => {
                if (t <= delStart) return t;
                if (t >= delEnd) return t - delLen;
                return delStart;
            };

            track.buffer = newBuffer;
            track.duration = newBuffer.duration;
            track.trimStart = remapTime(oldTrimStart);
            track.trimEnd = remapTime(oldTrimEnd);
            const newFadeInEnd = remapTime(oldFadeInEnd);
            const newFadeOutStart = remapTime(oldFadeOutStart);
            track.fadeInDuration = Math.max(0, newFadeInEnd - track.trimStart);
            track.fadeOutDuration = Math.max(0, track.trimEnd - newFadeOutStart);
            clampFades(track);

            waveformSelections.delete(trackId);
            trackPlayheadPos.delete(trackId);
            trackViewState.delete(trackId);
            renderTracks();
        }

        function syncTrackInputs(trackId, track) {
            const card = document.getElementById(`canvas-${trackId}`)?.closest('.track-card');
            if (!card) return;
            const inputs = card.querySelectorAll('.controls-grid input[type="number"]');
            if (inputs[0]) inputs[0].value = track.trimStart.toFixed(2);
            if (inputs[1]) inputs[1].value = track.trimEnd.toFixed(2);
            if (inputs[2]) inputs[2].value = track.fadeInDuration.toFixed(1);
            if (inputs[3]) inputs[3].value = track.fadeOutDuration.toFixed(1);
            if (inputs[4]) inputs[4].value = (track.offset || 0).toFixed(2);
            const pitchIn = card.querySelector('[data-pitch-input]');
            if (pitchIn) pitchIn.value = Number(track.pitchSemitones) || 0;
            const revIn = card.querySelector('[data-reverb-slider]');
            if (revIn) {
                revIn.value = Math.round(Number(track.reverb) || 0);
                const sp = revIn.nextElementSibling;
                if (sp && sp.classList.contains('vol-display')) sp.textContent = revIn.value + '%';
            }
            const durEl = card.querySelector('.track-duration');
            if (durEl) durEl.textContent = (track.trimEnd - track.trimStart).toFixed(1) + 's';
        }

        function updateOffset(id, value) {
            const track = tracks.find(t => t.id === id);
            if (!track) return;
            track.offset = Math.max(0, value || 0);
            renderGlobalTimeline();
        }

        function clampFades(track) {
            const halfDur = (track.trimEnd - track.trimStart) / 2;
            track.fadeInDuration = Math.min(track.fadeInDuration, halfDur);
            track.fadeOutDuration = Math.min(track.fadeOutDuration, halfDur);
        }

        function updateTrim(id, prop, value) {
            const track = tracks.find(t => t.id === id);
            if (!track) return;
            if (prop === 'trimStart') value = Math.max(0, Math.min(value, track.trimEnd - 0.2));
            if (prop === 'trimEnd') value = Math.max(track.trimStart + 0.2, Math.min(value, track.duration));
            if (track[prop] === value) return;
            pushUndo('audio.undoEditTrim');
            track[prop] = value;
            clampFades(track);
            const canvas = document.getElementById(`canvas-${id}`);
            if (canvas) drawWaveform(canvas, track);
            syncTrackInputs(id, track);
            renderGlobalTimeline();
        }

        function updateFade(id, prop, value) {
            const track = tracks.find(t => t.id === id);
            if (!track) return;
            const halfDur = (track.trimEnd - track.trimStart) / 2;
            value = Math.max(0, Math.min(value, halfDur));
            if (track[prop] === value) return;
            pushUndo('audio.undoEditFade');
            track[prop] = value;
            const canvas = document.getElementById(`canvas-${id}`);
            if (canvas) drawWaveform(canvas, track);
            syncTrackInputs(id, track);
            renderGlobalTimeline();
        }

        function updateTrack(id, prop, value) {
            const track = tracks.find(t => t.id === id);
            if (!track) return;
            if (prop === 'volume') value = Math.max(0, Math.min(2, value));
            track[prop] = value;
            renderTracks();
        }

        function updateTrackPitch(id, value) {
            const track = tracks.find(t => t.id === id);
            if (!track) return;
            if (!Number.isFinite(value)) value = 0;
            track.pitchSemitones = Math.max(-24, Math.min(24, value));
            renderGlobalTimeline();
            syncTrackInputs(id, track);
        }

        function updateTrackReverb(id, value, el) {
            const track = tracks.find(t => t.id === id);
            if (!track) return;
            track.reverb = Math.max(0, Math.min(100, value));
            if (el && el.nextElementSibling && el.nextElementSibling.classList.contains('vol-display')) {
                el.nextElementSibling.textContent = Math.round(track.reverb) + '%';
            }
            renderGlobalTimeline();
        }

        function toggleTrack(id) {
            if (activeTrackPlayers.has(id)) stopTrack(id);
            else {
                const track = tracks.find(t => t.id === id);
                const rel = trackPlayheadPos.get(id) || 0;
                playTrack(id, rel * ((track?.trimEnd || 0) - (track?.trimStart || 0)));
            }
        }

        function playTrack(id, relativeSeek) {
            stopTrack(id);
            const track = tracks.find(t => t.id === id);
            if (!track) return;

            const ctx = initAudioContext();
            const g = buildTrackGraph(ctx, track);
            g.volumeGain.connect(ctx.destination);

            const trimDur = track.trimEnd - track.trimStart;
            const rate = getTrackPlaybackRate(track);
            const startPos = track.trimStart + relativeSeek;
            const playBufRemain = trimDur - relativeSeek;
            const wallDur = playBufRemain / rate;
            const startTime = ctx.currentTime;

            applyTrackEnvelope(g.envelope, track, startTime, wallDur);

            g.source.start(startTime, startPos, playBufRemain);

            activeTrackPlayers.set(id, { source: g.source, startTime, seekOffset: relativeSeek, track, raf: null });
            updateTrackPlayButton(id);
            updateTrackPlayhead(id);
        }

        function stopTrack(id) {
            if (!activeTrackPlayers.has(id)) return;
            const p = activeTrackPlayers.get(id);
            const rate = getTrackPlaybackRate(p.track);
            const elapsed = (audioContext.currentTime - p.startTime) * rate + p.seekOffset;
            const dur = p.track.trimEnd - p.track.trimStart;
            trackPlayheadPos.set(id, Math.min(Math.max(elapsed / dur, 0), 1));
            try { p.source.stop(); } catch(e) {}
            if (p.raf) cancelAnimationFrame(p.raf);
            activeTrackPlayers.delete(id);
            updateTrackPlayButton(id);

            const canvas = document.getElementById(`canvas-${id}`);
            if (canvas) drawWaveform(canvas, p.track, trackPlayheadPos.get(id));
        }

        function updateTrackPlayhead(id) {
            const p = activeTrackPlayers.get(id);
            if (!p) return;
            const rate = getTrackPlaybackRate(p.track);
            const elapsed = (audioContext.currentTime - p.startTime) * rate + p.seekOffset;
            const dur = p.track.trimEnd - p.track.trimStart;
            const percent = Math.min(elapsed / dur, 1);

            const canvas = document.getElementById(`canvas-${id}`);
            if (canvas) drawWaveform(canvas, p.track, percent);

            if (percent < 1) p.raf = requestAnimationFrame(() => updateTrackPlayhead(id));
            else stopTrack(id);
        }

        async function applyTrim(id) {
            const track = tracks.find(t => t.id === id);
            if (!track) return;
            pushUndo('audio.undoTrimTrack');
            stopTrack(id);

            const trimDur = track.trimEnd - track.trimStart;
            const offline = new OfflineAudioContext(2, Math.ceil(trimDur * track.buffer.sampleRate), track.buffer.sampleRate);

            const source = offline.createBufferSource();
            source.buffer = track.buffer;
            const envelope = offline.createGain();
            const volumeGain = offline.createGain();
            volumeGain.gain.value = track.volume;

            source.connect(envelope).connect(volumeGain).connect(offline.destination);

            envelope.gain.setValueAtTime(track.fadesEnabled === false ? 1 : 0, 0);
            if (track.fadesEnabled !== false) {
                envelope.gain.linearRampToValueAtTime(1, track.fadeInDuration);
                const fadeOutStart = trimDur - track.fadeOutDuration;
                if (track.fadeOutDuration > 0) {
                    envelope.gain.setValueAtTime(1, fadeOutStart);
                    envelope.gain.linearRampToValueAtTime(0, trimDur);
                }
            }

            source.start(0, track.trimStart, trimDur);

            const newBuffer = await offline.startRendering();

            track.buffer = newBuffer;
            track.duration = newBuffer.duration;
            track.trimStart = 0;
            track.trimEnd = newBuffer.duration;
            const newFade = Math.min(1.5, newBuffer.duration * 0.1);
            track.fadeInDuration = newFade;
            track.fadeOutDuration = newFade;

            renderTracks();
        }

        function deleteTrack(id) {
            if (confirm(I18n.t('audio.deleteTrackConfirm'))) {
                stopTrack(id);
                tracks = tracks.filter(t => t.id !== id);
                trackViewState.delete(id);
                waveformSelections.delete(id);
                trackPlayheadPos.delete(id);
                renderTracks();
            }
        }

        function toggleMixPlay() {
            if (mixPlayer.isPlaying) stopMix();
            else playMix(mixPlayer.seekOffset || 0);
        }

        function playMix(fromSec = 0) {
            stopMix();
            initAudioContext();
            const startTime = audioContext.currentTime + 0.1;
            mixPlayer.startTime = startTime;
            mixPlayer.seekOffset = fromSec;
            mixPlayer.isPlaying = true;
            document.getElementById('mix-play-btn').innerHTML = '&#10074;&#10074; ' + I18n.t('audio.pauseMix');

            const maxDur = getMixDuration();
            document.getElementById('mix-total').textContent = formatTime(maxDur);
            updateMixPlayheadUI(fromSec / maxDur);
            document.getElementById('mix-current').textContent = formatTime(fromSec);

            tracks.forEach(track => {
                if (track.muted || track.trimEnd <= track.trimStart) return;

                const off = track.offset || 0;
                const wallDur = getTrackWallDuration(track);
                const trackEnd = off + wallDur;
                if (fromSec >= trackEnd) return;

                const g = buildTrackGraph(audioContext, track);
                g.volumeGain.connect(audioContext.destination);

                const rate = getTrackPlaybackRate(track);
                let bufStart = track.trimStart;
                let bufDur = track.trimEnd - track.trimStart;
                let playWallDur = wallDur;
                let trackStart = startTime + off - fromSec;

                const intoWall = fromSec - off;
                if (intoWall > 0) {
                    bufStart += intoWall * rate;
                    bufDur = track.trimEnd - bufStart;
                    if (bufDur <= 0) return;
                    playWallDur = bufDur / rate;
                }

                const when = Math.max(startTime, trackStart);
                applyTrackEnvelope(g.envelope, track, when, playWallDur);
                g.source.start(when, bufStart, bufDur);
                mixPlayer.sources.push(g.source);
            });

            updateMixProgress(maxDur);
        }

        function stopMix() {
            mixPlayer.sources.forEach(s => { try { s.stop(); } catch(e){} });
            mixPlayer.sources = [];
            mixPlayer.isPlaying = false;
            if (mixPlayer.raf) cancelAnimationFrame(mixPlayer.raf);
            document.getElementById('mix-play-btn').innerHTML = '&#9654; ' + I18n.t('audio.playMix');
            const totalDur = getMixDuration();
            const pct = totalDur > 0 ? mixPlayer.seekOffset / totalDur : 0;
            updateMixPlayheadUI(pct);
            document.getElementById('mix-current').textContent = formatTime(mixPlayer.seekOffset);
            renderGlobalTimeline(totalDur > 0 ? pct : null);
        }

        function updateMixProgress(totalDur) {
            if (!mixPlayer.isPlaying) return;
            const elapsed = audioContext.currentTime - mixPlayer.startTime;
            const current = mixPlayer.seekOffset + elapsed;
            const pct = Math.min(current / totalDur, 1);
            updateMixPlayheadUI(pct);
            document.getElementById('mix-current').textContent = formatTime(current);
            renderGlobalTimeline(pct);

            if (current < totalDur) mixPlayer.raf = requestAnimationFrame(() => updateMixProgress(totalDur));
            else {
                mixPlayer.seekOffset = totalDur;
                stopMix();
            }
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        async function downloadMix() {
            if (tracks.length === 0) return alert(I18n.t('audio.alertNoTracks'));
            initAudioContext();

            const maxDur = getMixDuration();
            if (maxDur === 0) return alert(I18n.t('audio.alertNoActiveTracks'));

            const offline = new OfflineAudioContext(2, Math.ceil(maxDur * audioContext.sampleRate), audioContext.sampleRate);

            tracks.forEach(track => {
                if (track.muted || track.trimEnd <= track.trimStart) return;
                const g = buildTrackGraph(offline, track);
                g.volumeGain.connect(offline.destination);

                const bufDur = track.trimEnd - track.trimStart;
                const wallDur = getTrackWallDuration(track);
                const off = track.offset || 0;

                applyTrackEnvelope(g.envelope, track, off, wallDur);

                g.source.start(off, track.trimStart, bufDur);
            });

            const rendered = await offline.startRendering();
            const wav = encodeWAV(rendered);

            if (window.showSaveFilePicker) {
                try {
                    const pickerOpts = {
                        suggestedName: getSuggestedMixFilename(),
                        types: [{ description: I18n.t('audio.wavFileKind'), accept: { 'audio/wav': ['.wav'] } }]
                    };
                    if (mixSaveFileHandle) pickerOpts.startIn = mixSaveFileHandle;
                    const saveHandle = await window.showSaveFilePicker(pickerOpts);
                    const writable = await saveHandle.createWritable();
                    await writable.write(wav);
                    await writable.close();
                    mixSaveFileHandle = saveHandle;
                    lastMixSaveName = saveHandle.name;
                    return;
                } catch (e) {
                    if (e.name === 'AbortError') return;
                }
            }

            const url = URL.createObjectURL(wav);
            const a = document.createElement('a');
            a.href = url;
            a.download = getSuggestedMixFilename();
            a.click();
            URL.revokeObjectURL(url);
        }

        function encodeWAV(buffer) {
            const numChannels = buffer.numberOfChannels;
            const sampleRate = buffer.sampleRate;
            const length = buffer.length * numChannels * 2;
            const arrayBuffer = new ArrayBuffer(44 + length);
            const view = new DataView(arrayBuffer);

            function writeString(v, o, s) { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); }

            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + length, true);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * numChannels * 2, true);
            view.setUint16(32, numChannels * 2, true);
            view.setUint16(34, 16, true);
            writeString(view, 36, 'data');
            view.setUint32(40, length, true);

            let offset = 44;
            for (let i = 0; i < buffer.length; i++) {
                for (let ch = 0; ch < numChannels; ch++) {
                    let sample = buffer.getChannelData(ch)[i];
                    sample = Math.max(-1, Math.min(1, sample));
                    view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7FFF, true);
                    offset += 2;
                }
            }
            return new Blob([arrayBuffer], {type: 'audio/wav'});
        }

        function refreshAudioI18n() {
            document.title = I18n.t('audio.pageTitle');
            I18n.applyTo(document.body);
            if (tracks.length) renderTracks();
            else renderGlobalTimeline();
            tracks.forEach(t => updateTrackPlayButton(t.id));
            updateUndoHint();
            const mixBtn = document.getElementById('mix-play-btn');
            if (mixBtn && mixPlayer.isPlaying) {
                mixBtn.innerHTML = '&#10074;&#10074; ' + I18n.t('audio.pauseMix');
            } else if (mixBtn) {
                mixBtn.innerHTML = '&#9654; ' + I18n.t('audio.playMix');
            }
        }

        window.onload = async () => {
            await I18n.init();
            refreshAudioI18n();
            window.addEventListener('message', (e) => {
                const d = e.data;
                if (!d || d.type !== I18n.MSG_TYPE) return;
                if (d.lang !== 'en' && d.lang !== 'ru') return;
                I18n.setLang(d.lang).then(refreshAudioI18n);
            });
            setupDragAndDrop();
            setupMixSeek();
            document.addEventListener('keydown', (e) => {
                if (e.target.matches('input, textarea, select, button')) return;

                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.shiftKey) {
                    e.preventDefault();
                    undoLastAction();
                    return;
                }

                if (e.code === 'Space') {
                    e.preventDefault();
                    if (focusedTrackId && tracks.some(t => t.id === focusedTrackId)) {
                        toggleTrack(focusedTrackId);
                    }
                    return;
                }

                if (e.key !== 'Delete' && e.key !== 'Backspace') return;
                for (const [trackId] of waveformSelections) {
                    deleteSelectedRegion(trackId);
                    break;
                }
            });
        };
    </script>
</body>
