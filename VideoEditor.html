<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>document.documentElement.classList.add('i18n-pending');</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Y3HKDGY95Z"></script>
    <script>

      gtag('config', 'G-Y3HKDGY95Z');

    <title>Video Editor</title>
    <link rel="stylesheet" href="dither-ui.css">
    <style>
        @font-face {
            font-family: 'Chicago';
            src: url('https://cdn.jsdelivr.net/gh/nicokimmel/chicago-pixel-font@main/Chicago.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }

        body {
            font-family: 'Chicago', 'VT323', 'Geneva', monospace;
            font-size: 13px;
            background: #c0c0c0;
            color: #000;
            cursor: default;
            -webkit-font-smoothing: none;
            -moz-osx-font-smoothing: none;
            display: flex;
            flex-direction: column;
        }

        .desktop {
            padding: 12px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 0;
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
        }

        .mac-window {
            background: #fff;
            border: 2px solid #000;
            box-shadow: 2px 2px 0 #000;
            display: flex;
            flex-direction: column;
        }

        #upload-window {
            flex-shrink: 0;
        }

        #editor-window {
            flex: 1;
            min-height: 0;
            display: none;
        }
        #editor-window.is-open {
            display: flex;
        }

        .title-bar {
            height: 22px;
            background: #fff;
            border-bottom: 2px solid #000;
            display: flex;
            align-items: center;
            padding: 0 4px;
            position: relative;
            user-select: none;
            flex-shrink: 0;
        }

        .title-bar-lines {
            position: absolute;
            left: 4px;
            right: 4px;
            top: 3px;
            bottom: 3px;
            z-index: 0;
            background: repeating-linear-gradient(to bottom, #000 0px, #000 1px, #fff 1px, #fff 3px);
        }

        .title-bar-text {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            transform: translateX(-50%);
            z-index: 1;
            display: flex;
            align-items: center;
            background: #fff;
            padding: 0 10px;
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
            pointer-events: none;
            max-width: calc(100% - 48px);
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .title-bar-controls {
            display: flex;
            align-items: center;
            gap: 4px;
            align-self: stretch;
            flex-shrink: 0;
            position: relative;
            z-index: 2;
            background: #fff;
            padding: 0 12px 0 0;
        }

        .close-box {
            width: 14px;
            height: 14px;
            border: 2px solid #000;
            background: #fff;
            position: relative;
            z-index: 2;
            flex-shrink: 0;
            cursor: pointer;
        }
        .close-box::before,
        .close-box::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 2px;
            background: #000;
        }
        .close-box::before { transform: translate(-50%, -50%) rotate(45deg); }
        .close-box::after { transform: translate(-50%, -50%) rotate(-45deg); }
        .close-box:hover { background: #000; }
        .close-box:hover::before,
        .close-box:hover::after { background: #fff; }
        .close-box:active { background: #000; }

        .window-content { padding: 16px; }

        .window-content--editor {
            padding: 0;
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }

        .mac-btn {
            font-family: 'Chicago', 'VT323', 'Geneva', monospace;
            font-size: 13px;
            padding: 5px 16px;
            border: 2px solid #000;
            border-radius: 0;
            background: #fff;
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap;
            box-shadow: var(--mac-push-shadow);
        }
        .mac-btn:hover:not(:disabled) {
            background-color: #fff;
            background-image: var(--dither-dot-hover);
            background-size: var(--dither-step) var(--dither-step);
        }
        .mac-btn:active:not(:disabled) {
            background: #000;
            color: #fff;
            box-shadow: none;
            transform: translate(2px, 2px);
        }
        .mac-btn:disabled {
            color: #999;
            border-color: #999;
            cursor: default;
            background: #fff;
            box-shadow: 1px 1px 0 #bbb;
        }
        .mac-btn:disabled:hover {
            background: #fff;
            background-image: none;
        }

        .upload-area {
            border: 2px dashed #000;
            padding: 36px 20px;
            text-align: center;
            cursor: pointer;
            background: #fff;
            transition: border-color 0.15s;
        }
        .upload-area:hover {
            background-color: #fff;
            background-image: var(--dither-dot-hover);
            background-size: var(--dither-step) var(--dither-step);
        }
        .upload-area.dragover {
            background-color: #fff;
            background-image: var(--dither-dot-strong);
            background-size: var(--dither-step) var(--dither-step);
            border-style: solid;
        }
        .upload-icon { font-size: 28px; margin-bottom: 6px; display: block; }

        .preview-wrap {
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            border: 2px inset #888;
            background-color: #c0c0c0;
            background-image:
                linear-gradient(45deg, #b0b0b0 25%, transparent 25%),
                linear-gradient(-45deg, #b0b0b0 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #b0b0b0 75%),
                linear-gradient(-45deg, transparent 75%, #b0b0b0 75%);
            background-size: 12px 12px;
            background-position: 0 0, 0 6px, 6px -6px, -6px 0;
        }
        .preview-wrap video {
            max-width: 100%;
            max-height: 100%;
            display: block;
        }
        #crop-canvas {
            position: absolute;
            display: none;
            touch-action: none;
            cursor: default;
            z-index: 2;
        }
        #crop-canvas.is-active {
            display: block;
        }

        .crop-bar {
            display: none;
            gap: 8px;
            padding: 8px 16px;
            align-items: center;
            border-top: 1px solid #ccc;
            background: #fff;
            flex-wrap: wrap;
        }
        .crop-bar.is-visible {
            display: flex;
        }
        .crop-bar .crop-hint {
            font-size: 11px;
            color: #555;
            margin-left: auto;
        }

        .controls-bar {
            padding: 8px 16px;
            border-top: 2px solid #000;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            background: #fff;
        }

        /* Timeline: same language as AudioEditor (.canvas-container / .global-timeline-wrap / .timeline-row) */
        .timeline-bar {
            padding: 12px 16px;
            border-top: 1px solid #ccc;
            background: #fff;
            user-select: none;
            -webkit-user-select: none;
        }
        .timeline-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 12px;
        }
        .timeline-time {
            font-weight: bold;
            min-width: 3.5em;
        }
        .timeline-time--muted {
            color: #666;
        }
        .timeline-info-text {
            font-size: 11px;
            color: #666;
            line-height: 1.4;
            margin: 0 8px;
            flex: 1;
            text-align: center;
        }

        .timeline-track-wrap {
            position: relative;
            margin: 8px 0 0;
            border: 2px inset #888;
            background: #fff;
            overflow: hidden;
        }
        .timeline-track {
            position: relative;
            height: 80px;
            background: #fff;
            cursor: ew-resize;
            touch-action: none;
        }
        .timeline-track.is-dragging { cursor: grabbing; }
        .timeline-shade {
            position: absolute;
            top: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.06);
            pointer-events: none;
            z-index: 0;
        }
        .timeline-shade--l { left: 0; }
        .timeline-shade--r { right: 0; }
        .timeline-selection {
            position: absolute;
            top: 0;
            bottom: 0;
            z-index: 1;
            box-sizing: border-box;
            min-width: 4px;
            border-left: 4px solid #000;
            border-right: 4px solid #000;
            background: rgba(0, 0, 0, 0.12);
            pointer-events: none;
        }
        .timeline-playhead {
            position: absolute;
            top: 12px;
            bottom: 0;
            width: 3px;
            margin-left: -1px;
            z-index: 4;
            pointer-events: none;
            will-change: left;
            background: repeating-linear-gradient(
                to bottom,
                #000 0px,
                #000 2px,
                transparent 2px,
                transparent 5px
            );
        }
        .timeline-playhead::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 10px solid #000;
        }

        .trim-bar {
            padding: 8px 16px;
            border-top: 1px solid #ccc;
            background: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            font-size: 12px;
        }
        .trim-bar label { font-weight: bold; }
        .trim-input {
            font-family: 'Chicago', 'VT323', 'Geneva', monospace;
            font-size: 12px;
            width: 65px;
            border: 2px inset #888;
            background: #fff;
            padding: 2px 5px;
            outline: none;
            text-align: center;
        }
        .trim-input:focus { border-color: #000; }
        .trim-sep { color: #555; }

        .info-row {
            font-size: 12px;
            padding: 10px 16px 8px;
            border-top: 1px solid #ccc;
            line-height: 1.6;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        .info-row .label { color: #555; }
        .info-row b { color: #000; font-weight: bold; }

        .resize-bar {
            padding: 8px 16px;
            border-top: 1px solid #ccc;
            background: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            font-size: 12px;
        }
        .resize-bar label { font-weight: bold; }
        .resize-input {
            font-family: 'Chicago', 'VT323', 'Geneva', monospace;
            font-size: 12px;
            width: 60px;
            border: 2px inset #888;
            background: #fff;
            padding: 2px 5px;
            outline: none;
            text-align: center;
        }
        .resize-input:focus { border-color: #000; }
        .resize-lock {
            cursor: pointer;
            font-size: 14px;
            user-select: none;
        }

        .chk-row {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
        }

        .progress-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 14px;
            gap: 10px;
            z-index: 10;
        }
        .progress-overlay .bar-bg {
            width: 200px;
            height: 12px;
            border: 2px solid #fff;
            background: #000;
        }
        .progress-overlay .bar-fill {
            height: 100%;
            background: #fff;
            width: 0%;
            transition: width 0.2s;
        }

        ::selection { background: #000; color: #fff; }
    </style>
</head>
<body>

<div class="desktop">
    <div class="mac-window" id="upload-window">
        <div class="title-bar">
            <div class="title-bar-lines"></div>
            <div class="title-bar-text" data-i18n="video.uploadBar">Upload</div>
        </div>
        <div class="window-content">
            <div class="upload-area" id="upload-area">
                <span class="upload-icon">&#9654;</span>
                <div style="font-weight:bold;font-size:14px;margin-bottom:4px;" data-i18n="video.dropHere">Drop video here</div>
                <div style="font-size:12px;color:#666;" data-i18n="video.dropHint">…or click to select a file</div>
            </div>
        </div>
    </div>

    <div class="mac-window" id="editor-window">
        <div class="title-bar">
            <div class="title-bar-controls">
                <div class="close-box" onclick="closeEditor()"></div>
            </div>
            <div class="title-bar-lines"></div>
            <div class="title-bar-text" id="editor-title">Video Editor</div>
        </div>
        <div class="window-content window-content--editor">
            <div class="preview-wrap" id="preview-wrap">
                <video id="video" preload="metadata"></video>
                <canvas id="crop-canvas"></canvas>
                <div class="progress-overlay" id="progress" style="display:none">
                    <div id="progress-processing" data-i18n="video.processing">Processing…</div>
                    <div class="bar-bg"><div class="bar-fill" id="progress-bar"></div></div>
                    <div id="progress-text">0%</div>
                </div>
            </div>

            <div class="timeline-bar">
                <div class="timeline-row">
                    <span class="timeline-time" id="time-current">0:00</span>
                    <span class="timeline-info-text" data-i18n="video.timelineHint">Drag the thick trim lines or the middle band · click elsewhere to seek</span>
                    <span class="timeline-time timeline-time--muted" id="time-total">0:00</span>
                </div>
                <div class="timeline-track-wrap">
                    <div class="timeline-track" id="timeline-track">
                        <div class="timeline-shade timeline-shade--l" id="shade-left"></div>
                        <div class="timeline-shade timeline-shade--r" id="shade-right"></div>
                        <div class="timeline-selection" id="trim-range" style="display:none"></div>
                        <div class="timeline-playhead" id="playhead"></div>
                    </div>
                </div>
            </div>

            <div class="crop-bar" id="crop-bar">
                <button class="mac-btn" onclick="applyVideoCrop()">&#10003; <span data-i18n="image.applyCrop">Apply Crop</span></button>
                <button class="mac-btn" onclick="cancelVideoCrop()">&#10005; <span data-i18n="image.cancelCrop">Cancel</span></button>
                <span class="crop-hint" data-i18n="image.cropHint">Drag corners to resize &bull; drag inside to move</span>
            </div>

            <div class="controls-bar">
                <button class="mac-btn" id="btn-play" onclick="togglePlay()">&#9654; Play</button>
                <button class="mac-btn" id="btn-crop" onclick="enterVideoCropMode()">&#9986; <span data-i18n="image.btnCrop">Crop</span></button>
                <div class="chk-row" style="margin-left:8px">
                    <input type="checkbox" id="chk-audio" checked onchange="toggleAudio()">
                    <label for="chk-audio" data-i18n="video.keepAudio">Keep audio</label>
                </div>
                <button class="mac-btn" onclick="resetSession()" style="margin-left:auto">&#8634; <span data-i18n="video.reset">Reset</span></button>
                <button class="mac-btn" onclick="exportVideo()">&#8615; <span data-i18n="video.save">Save</span></button>
            </div>

            <div class="trim-bar">
                <label data-i18n="video.labelInOut">In / Out (sec):</label>
                <input class="trim-input" id="trim-start" type="text" value="0.00" onchange="onTrimInput()" data-i18n-title="video.trimStartTitle" title="Trim start (seconds)">
                <span class="trim-sep">&#8594;</span>
                <input class="trim-input" id="trim-end" type="text" value="0.00" onchange="onTrimInput()" data-i18n-title="video.trimEndTitle" title="Trim end (seconds)">
                <span id="trim-duration" style="color:#555"></span>
            </div>

            <div class="resize-bar">
                <label data-i18n="video.labelSize">Size:</label>
                <input class="resize-input" id="resize-w" type="number" onchange="onResizeW()">
                <span>&#215;</span>
                <input class="resize-input" id="resize-h" type="number" onchange="onResizeH()">
                <span class="resize-lock" id="lock-ratio" onclick="toggleLock()" data-i18n-title="video.lockRatio" title="Lock aspect ratio">[=]</span>
                <button class="mac-btn" onclick="resetSize()" style="font-size:11px;padding:3px 10px"><span data-i18n="video.original">Original</span></button>
            </div>

            <div class="info-row" id="info-row"></div>
        </div>
    </div>
</div>

<script src="i18n.js"></script>
<script type="module">
    import { FFmpeg } from './vendor/ffmpeg-esm/index.js';
    import { toBlobURL } from 'https://unpkg.com/@ffmpeg/util@0.12.1/dist/esm/index.js';

    let ffmpegProgressLabelKey = 'video.loadingFFmpegEllipsis';

    const video = document.getElementById('video');
    const timelineTrack = document.getElementById('timeline-track');
    const shadeLeft = document.getElementById('shade-left');
    const shadeRight = document.getElementById('shade-right');
    const trimRangeEl = document.getElementById('trim-range');
    const playhead = document.getElementById('playhead');
    const uploadArea = document.getElementById('upload-area');
    const progressEl = document.getElementById('progress');
    const progressBar = document.getElementById('progress-bar');
    const progressText = document.getElementById('progress-text');
    const cropCanvas = document.getElementById('crop-canvas');
    const cropCtx = cropCanvas.getContext('2d');
    const previewWrap = document.getElementById('preview-wrap');

    let originalFile = null;
    let originalW = 0, originalH = 0;
    let lockRatio = true;
    let trimStart = 0, trimEnd = 0;
    let seeking = false;
    /** True after auto-pause at trim end — playhead snaps to trimEnd; Play jumps to trimStart. */
    let stoppedAtTrimEnd = false;
    let playheadRaf = null;
    /** Seconds: treat as "at end of trim" for replay (keyframes / float). */
    const TRIM_END_EPS = 0.12;
    let ffmpeg = null;
    const MIN_TRIM_SEC = 1 / 25;
    let timelineDrag = null;
    let trimMoveState = null;

    /** Applied spatial crop in source pixels; null = full frame. */
    let videoCrop = null;
    let cropActive = false;
    let cropRect = { x: 0, y: 0, w: 0, h: 0 };
    let cropDragType = null;
    let cropDragStart = null;
    let cropDisplayScale = 1;
    let cropAntOffset = 0;
    let cropAntRAF = null;
    const CROP_HANDLE_SIZE = 7;
    const CROP_HANDLE_HIT = 12;
    const CROP_MIN = 10;

    window.togglePlay = togglePlay;
    window.onTrimInput = onTrimInput;
    window.toggleAudio = toggleAudio;
    window.toggleLock = toggleLock;
    window.onResizeW = onResizeW;
    window.onResizeH = onResizeH;
    window.resetSize = resetSize;
    window.resetSession = resetSession;
    window.closeEditor = closeEditor;
    window.exportVideo = exportVideo;
    window.enterVideoCropMode = enterVideoCropMode;
    window.applyVideoCrop = applyVideoCrop;
    window.cancelVideoCrop = cancelVideoCrop;

    function clamp(v, lo, hi) {
        return Math.max(lo, Math.min(hi, v));
    }

    function getSourceCrop() {
        if (videoCrop) return { ...videoCrop };
        return { x: 0, y: 0, w: originalW, h: originalH };
    }

    function getEffectiveDimensions() {
        const c = getSourceCrop();
        return { w: c.w, h: c.h };
    }

    function getVideoDisplayRect() {
        if (!originalW || !originalH) return null;
        const wrapRect = previewWrap.getBoundingClientRect();
        const wrapW = wrapRect.width;
        const wrapH = wrapRect.height;
        if (wrapW <= 0 || wrapH <= 0) return null;
        const scale = Math.min(wrapW / originalW, wrapH / originalH);
        const dispW = originalW * scale;
        const dispH = originalH * scale;
        const left = (wrapW - dispW) / 2;
        const top = (wrapH - dispH) / 2;
        return { scale, dispW, dispH, left, top };
    }

    function layoutCropCanvas() {
        const dr = getVideoDisplayRect();
        if (!dr) {
            cropCanvas.classList.remove('is-active');
            return;
        }
        cropDisplayScale = dr.scale;
        cropCanvas.width = Math.max(1, Math.round(dr.dispW));
        cropCanvas.height = Math.max(1, Math.round(dr.dispH));
        cropCanvas.style.left = dr.left + 'px';
        cropCanvas.style.top = dr.top + 'px';
        cropCanvas.style.width = dr.dispW + 'px';
        cropCanvas.style.height = dr.dispH + 'px';
        if (cropActive) {
            cropCanvas.classList.add('is-active');
            drawVideoCropOverlay();
        }
    }

    function syncVideoCropPreview() {
        if (!videoCrop || cropActive) {
            video.style.clipPath = '';
            return;
        }
        const { x, y, w, h } = videoCrop;
        const top = (y / originalH) * 100;
        const right = ((originalW - x - w) / originalW) * 100;
        const bottom = ((originalH - y - h) / originalH) * 100;
        const left = (x / originalW) * 100;
        video.style.clipPath = `inset(${top}% ${right}% ${bottom}% ${left}%)`;
    }

    function syncResizeFromEffective() {
        const { w, h } = getEffectiveDimensions();
        document.getElementById('resize-w').value = w;
        document.getElementById('resize-h').value = h;
    }

    function drawVideoCropOverlay() {
        if (!cropActive || !cropCanvas.width) return;
        const cw = cropCanvas.width;
        const ch = cropCanvas.height;
        const ctx = cropCtx;
        const cr = {
            x: cropRect.x * cropDisplayScale,
            y: cropRect.y * cropDisplayScale,
            w: cropRect.w * cropDisplayScale,
            h: cropRect.h * cropDisplayScale
        };

        ctx.clearRect(0, 0, cw, ch);

        ctx.save();
        ctx.beginPath();
        ctx.rect(0, 0, cw, ch);
        ctx.rect(cr.x + cr.w, cr.y, -cr.w, cr.h);
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        ctx.fill('evenodd');
        ctx.restore();

        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1;
        ctx.setLineDash([5, 5]);
        ctx.lineDashOffset = -cropAntOffset;
        ctx.strokeRect(cr.x + 0.5, cr.y + 0.5, cr.w, cr.h);

        ctx.strokeStyle = '#fff';
        ctx.lineDashOffset = -cropAntOffset + 5;
        ctx.strokeRect(cr.x + 0.5, cr.y + 0.5, cr.w, cr.h);
        ctx.setLineDash([]);

        const hs = CROP_HANDLE_SIZE;
        ctx.fillStyle = '#fff';
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1.5;
        const corners = [
            [cr.x, cr.y],
            [cr.x + cr.w, cr.y],
            [cr.x, cr.y + cr.h],
            [cr.x + cr.w, cr.y + cr.h]
        ];
        for (const [hx, hy] of corners) {
            ctx.fillRect(hx - hs / 2, hy - hs / 2, hs, hs);
            ctx.strokeRect(hx - hs / 2, hy - hs / 2, hs, hs);
        }

        const dimText = `${Math.round(cropRect.w)} \u00d7 ${Math.round(cropRect.h)}`;
        ctx.font = 'bold 12px "Chicago", "VT323", monospace';
        const tm = ctx.measureText(dimText);
        const tx = cr.x + cr.w / 2 - tm.width / 2;
        const ty = cr.y + cr.h + 16;
        if (ty < ch - 4) {
            ctx.fillStyle = '#fff';
            ctx.fillRect(tx - 3, ty - 11, tm.width + 6, 14);
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1;
            ctx.strokeRect(tx - 3, ty - 11, tm.width + 6, 14);
            ctx.fillStyle = '#000';
            ctx.fillText(dimText, tx, ty);
        }
    }

    function animateVideoCropAnts() {
        if (!cropActive) return;
        cropAntOffset = (cropAntOffset + 0.6) % 10;
        drawVideoCropOverlay();
        cropAntRAF = requestAnimationFrame(animateVideoCropAnts);
    }

    function nearCrop(x1, y1, x2, y2, r) {
        return Math.abs(x1 - x2) < r && Math.abs(y1 - y2) < r;
    }

    function getVideoCropHit(mx, my) {
        const cr = {
            x: cropRect.x * cropDisplayScale,
            y: cropRect.y * cropDisplayScale,
            w: cropRect.w * cropDisplayScale,
            h: cropRect.h * cropDisplayScale
        };
        const h = CROP_HANDLE_HIT;
        if (nearCrop(mx, my, cr.x, cr.y, h)) return 'nw';
        if (nearCrop(mx, my, cr.x + cr.w, cr.y, h)) return 'ne';
        if (nearCrop(mx, my, cr.x, cr.y + cr.h, h)) return 'sw';
        if (nearCrop(mx, my, cr.x + cr.w, cr.y + cr.h, h)) return 'se';
        if (mx >= cr.x && mx <= cr.x + cr.w && my >= cr.y && my <= cr.y + cr.h) return 'move';
        return null;
    }

    function getVideoCropCursor(type) {
        const map = { nw: 'nwse-resize', se: 'nwse-resize', ne: 'nesw-resize', sw: 'nesw-resize', move: 'move' };
        return map[type] || 'default';
    }

    function enterVideoCropMode() {
        if (cropActive || !originalW) return;
        if (!video.paused) video.pause();
        syncVideoPlayButton();
        cropActive = true;
        const base = getSourceCrop();
        cropRect = { x: base.x, y: base.y, w: base.w, h: base.h };
        video.style.clipPath = '';
        document.getElementById('crop-bar').classList.add('is-visible');
        document.getElementById('btn-crop').disabled = true;
        cropAntOffset = 0;
        layoutCropCanvas();
        animateVideoCropAnts();
    }

    function applyVideoCrop() {
        const cx = Math.round(Math.max(0, cropRect.x));
        const cy = Math.round(Math.max(0, cropRect.y));
        const cw = Math.round(Math.min(cropRect.w, originalW - cx));
        const ch = Math.round(Math.min(cropRect.h, originalH - cy));
        if (cw < 1 || ch < 1) {
            cancelVideoCrop();
            return;
        }
        if (cx === 0 && cy === 0 && cw === originalW && ch === originalH) {
            videoCrop = null;
        } else {
            videoCrop = { x: cx, y: cy, w: cw, h: ch };
        }
        exitVideoCropMode();
        syncVideoCropPreview();
        syncResizeFromEffective();
        updateInfo();
    }

    function cancelVideoCrop() {
        exitVideoCropMode();
        syncVideoCropPreview();
    }

    function exitVideoCropMode() {
        cropActive = false;
        cropDragType = null;
        cropDragStart = null;
        if (cropAntRAF) {
            cancelAnimationFrame(cropAntRAF);
            cropAntRAF = null;
        }
        document.getElementById('crop-bar').classList.remove('is-visible');
        document.getElementById('btn-crop').disabled = false;
        cropCanvas.classList.remove('is-active');
        cropCtx.clearRect(0, 0, cropCanvas.width, cropCanvas.height);
        cropCanvas.style.cursor = 'default';
    }

    cropCanvas.addEventListener('pointerdown', e => {
        if (!cropActive) return;
        const rect = cropCanvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        const hit = getVideoCropHit(mx, my);
        if (hit) {
            cropDragType = hit;
            cropDragStart = { mx, my, rect: { ...cropRect } };
            try { cropCanvas.setPointerCapture(e.pointerId); } catch (_) {}
            e.preventDefault();
        }
    });

    cropCanvas.addEventListener('pointermove', e => {
        if (!cropActive) return;
        const rect = cropCanvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;

        if (cropDragType && cropDragStart) {
            const dx = (mx - cropDragStart.mx) / cropDisplayScale;
            const dy = (my - cropDragStart.my) / cropDisplayScale;
            const sr = cropDragStart.rect;
            const imgW = originalW;
            const imgH = originalH;

            if (cropDragType === 'move') {
                cropRect.x = clamp(sr.x + dx, 0, imgW - sr.w);
                cropRect.y = clamp(sr.y + dy, 0, imgH - sr.h);
                cropRect.w = sr.w;
                cropRect.h = sr.h;
            } else if (cropDragType === 'nw') {
                const nx = clamp(sr.x + dx, 0, sr.x + sr.w - CROP_MIN);
                const ny = clamp(sr.y + dy, 0, sr.y + sr.h - CROP_MIN);
                cropRect.w = sr.x + sr.w - nx;
                cropRect.h = sr.y + sr.h - ny;
                cropRect.x = nx;
                cropRect.y = ny;
            } else if (cropDragType === 'ne') {
                const ny = clamp(sr.y + dy, 0, sr.y + sr.h - CROP_MIN);
                cropRect.w = clamp(sr.w + dx, CROP_MIN, imgW - sr.x);
                cropRect.h = sr.y + sr.h - ny;
                cropRect.y = ny;
            } else if (cropDragType === 'sw') {
                const nx = clamp(sr.x + dx, 0, sr.x + sr.w - CROP_MIN);
                cropRect.w = sr.x + sr.w - nx;
                cropRect.h = clamp(sr.h + dy, CROP_MIN, imgH - sr.y);
                cropRect.x = nx;
            } else if (cropDragType === 'se') {
                cropRect.w = clamp(sr.w + dx, CROP_MIN, imgW - sr.x);
                cropRect.h = clamp(sr.h + dy, CROP_MIN, imgH - sr.y);
            }
            drawVideoCropOverlay();
        } else {
            cropCanvas.style.cursor = getVideoCropCursor(getVideoCropHit(mx, my));
        }
    });

    function endVideoCropDrag(e) {
        if (!cropDragType) return;
        try {
            if (e && e.pointerId != null) cropCanvas.releasePointerCapture(e.pointerId);
        } catch (_) {}
        cropDragType = null;
        cropDragStart = null;
    }

    cropCanvas.addEventListener('pointerup', endVideoCropDrag);
    cropCanvas.addEventListener('pointercancel', endVideoCropDrag);
    cropCanvas.addEventListener('lostpointercapture', () => {
        cropDragType = null;
        cropDragStart = null;
    });

    uploadArea.addEventListener('click', () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'video/*';
        input.onchange = e => { if (e.target.files[0]) loadVideo(e.target.files[0]); };
        input.click();
    });

    uploadArea.addEventListener('dragover', e => {
        e.preventDefault();
        uploadArea.classList.add('dragover');
    });
    uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
    uploadArea.addEventListener('drop', e => {
        e.preventDefault();
        uploadArea.classList.remove('dragover');
        if (e.dataTransfer.files[0]) loadVideo(e.dataTransfer.files[0]);
    });

    function showProgress(text, pct) {
        progressEl.style.display = 'flex';
        progressText.textContent = text;
        progressBar.style.width = (pct || 0) + '%';
    }

    function syncVideoPlayButton() {
        const btn = document.getElementById('btn-play');
        if (!btn) return;
        if (!video.paused) {
            btn.innerHTML = '&#10074;&#10074; ' + I18n.t('video.pause');
        } else {
            btn.innerHTML = '&#9654; ' + I18n.t('video.play');
        }
    }
    function hideProgress() { progressEl.style.display = 'none'; }

    async function readBlobAsUint8Array(blob) {
        if (blob && typeof blob.arrayBuffer === 'function') {
            try {
                return new Uint8Array(await blob.arrayBuffer());
            } catch (_) { /* try FileReader */ }
        }
        return new Promise((resolve, reject) => {
            const fr = new FileReader();
            fr.onload = () => resolve(new Uint8Array(fr.result));
            fr.onerror = () => reject(fr.error || new Error('FileReader failed'));
            fr.readAsArrayBuffer(blob);
        });
    }

    /** Prefer reading the active preview blob (works when File.arrayBuffer fails in some browsers). */
    async function readVideoBytesForExport() {
        const src = video.src || '';
        if (src.startsWith('blob:')) {
            try {
                const res = await fetch(src);
                if (!res.ok) throw new Error('blob fetch not ok');
                return new Uint8Array(await res.arrayBuffer());
            } catch (e) {
                console.warn('Reading preview blob failed, using file:', e);
            }
        }
        return readBlobAsUint8Array(originalFile);
    }

    function loadVideo(file) {
        originalFile = file;
        if (video.src) URL.revokeObjectURL(video.src);

        const url = URL.createObjectURL(file);
        tryLoadUrl(url, file);
    }

    function tryLoadUrl(url, file) {
        video.onloadedmetadata = null;
        video.onerror = null;

        video.onerror = () => {
            URL.revokeObjectURL(url);
            originalFile = null;
            alert(I18n.t('video.alertFormat'));
        };

        video.onloadedmetadata = () => {
            onVideoReady();
        };

        video.preload = 'metadata';
        video.src = url;
        video.load();
    }

    function onVideoReady() {
        originalW = video.videoWidth;
        originalH = video.videoHeight;
        trimStart = 0;
        trimEnd = video.duration;
        stoppedAtTrimEnd = false;
        stopPlayheadRaf();
        videoCrop = null;
        exitVideoCropMode();
        video.style.clipPath = '';

        document.getElementById('resize-w').value = originalW;
        document.getElementById('resize-h').value = originalH;
        syncTrimUI();
        updateInfo();
        layoutCropCanvas();

        document.getElementById('editor-title').textContent = originalFile ? originalFile.name : I18n.t('video.editorTitle');
        document.getElementById('editor-window').classList.add('is-open');
        hideProgress();
    }

    async function loadFFmpeg() {
        if (ffmpeg && ffmpeg.loaded) return ffmpeg;
        ffmpeg = new FFmpeg();
        ffmpeg.on('progress', ({ progress }) => {
            const pct = Math.max(0, Math.min(100, Math.round(progress * 100)));
            showProgress(I18n.t(ffmpegProgressLabelKey) + ': ' + pct + '%', pct);
        });
        ffmpegProgressLabelKey = 'video.loadingFFmpegEllipsis';
        showProgress(I18n.t('video.loadingFFmpegEllipsis'), 0);
        const baseURL = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/esm';
        await ffmpeg.load({
            coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript'),
            wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm'),
        });
        return ffmpeg;
    }

    function formatTime(s) {
        if (isNaN(s)) s = 0;
        const m = Math.floor(s / 60);
        const sec = Math.floor(s % 60);
        return `${m}:${sec < 10 ? '0' : ''}${sec}`;
    }

    function formatTimePrecise(s) {
        return Math.max(0, s).toFixed(2);
    }

    function getDuration() {
        const d = video.duration;
        return d && isFinite(d) && d > 0 ? d : 0;
    }

    function timeFromClientX(clientX) {
        const r = timelineTrack.getBoundingClientRect();
        if (r.width <= 0) return 0;
        const d = getDuration();
        const t = ((clientX - r.left) / r.width) * d;
        return Math.max(0, Math.min(d, t));
    }

    function getPlayheadTimelineSeconds() {
        if (stoppedAtTrimEnd) return trimEnd;
        return video.currentTime;
    }

    function setPlayheadPercentFromTime() {
        const d = getDuration();
        if (!d) return;
        let t = getPlayheadTimelineSeconds();
        if (!video.paused && !seeking) t = Math.min(t, trimEnd);
        playhead.style.left = (t / d) * 100 + '%';
    }

    function layoutTimeline() {
        const d = getDuration();
        if (!d) {
            trimRangeEl.style.display = 'none';
            playhead.style.left = '0%';
            return;
        }
        trimRangeEl.style.display = 'block';
        const pS = (trimStart / d) * 100;
        const pE = (trimEnd / d) * 100;
        shadeLeft.style.width = pS + '%';
        shadeRight.style.left = pE + '%';
        shadeRight.style.width = (100 - pE) + '%';
        trimRangeEl.style.left = pS + '%';
        trimRangeEl.style.width = Math.max(0.05, pE - pS) + '%';
        setPlayheadPercentFromTime();
    }

    function updatePlayheadOnly() {
        setPlayheadPercentFromTime();
    }

    function stopPlayheadRaf() {
        if (playheadRaf != null) {
            cancelAnimationFrame(playheadRaf);
            playheadRaf = null;
        }
    }

    function tickPlayheadWhilePlaying() {
        if (video.paused || seeking) {
            playheadRaf = null;
            return;
        }
        if (video.currentTime >= trimEnd) {
            video.pause();
            video.currentTime = trimEnd;
            stoppedAtTrimEnd = true;
            syncVideoPlayButton();
            setPlayheadPercentFromTime();
            document.getElementById('time-current').textContent = formatTime(trimEnd);
            playheadRaf = null;
            return;
        }
        setPlayheadPercentFromTime();
        document.getElementById('time-current').textContent = formatTime(Math.min(video.currentTime, trimEnd));
        playheadRaf = requestAnimationFrame(tickPlayheadWhilePlaying);
    }

    function startPlayheadRaf() {
        stopPlayheadRaf();
        if (!video.paused && !seeking) playheadRaf = requestAnimationFrame(tickPlayheadWhilePlaying);
    }

    function endTimelineDrag(e) {
        if (!timelineDrag) return;
        try {
            if (e && e.pointerId != null) timelineTrack.releasePointerCapture(e.pointerId);
        } catch (_) {}
        timelineTrack.classList.remove('is-dragging');
        timelineDrag = null;
        trimMoveState = null;
        seeking = false;
        updatePlayheadOnly();
        document.getElementById('time-current').textContent = formatTime(getPlayheadTimelineSeconds());
    }

    function beginScrubDrag(t) {
        timelineDrag = 'seek';
        seeking = true;
        stoppedAtTrimEnd = false;
        stopPlayheadRaf();
        video.pause();
        syncVideoPlayButton();
        video.currentTime = t;
        document.getElementById('time-current').textContent = formatTime(t);
        layoutTimeline();
    }

    timelineTrack.addEventListener('pointerdown', e => {
        const d = getDuration();
        if (!d) return;
        e.preventDefault();
        const t = timeFromClientX(e.clientX);
        const r = timelineTrack.getBoundingClientRect();
        const pxPerSec = r.width / d;
        const handleTol = 16;
        const playheadGrabTol = 32;

        const distStartPx = Math.abs(t - trimStart) * pxPerSec;
        const distEndPx = Math.abs(t - trimEnd) * pxPerSec;
        const distPlayPx = Math.abs(t - video.currentTime) * pxPerSec;

        if (distStartPx <= handleTol && t <= trimEnd + 1e-6) {
            timelineDrag = 'trim-start';
            stoppedAtTrimEnd = false;
        } else if (distEndPx <= handleTol && t >= trimStart - 1e-6) {
            timelineDrag = 'trim-end';
            stoppedAtTrimEnd = false;
        } else if (distPlayPx <= playheadGrabTol) {
            beginScrubDrag(t);
        } else if (t > trimStart && t < trimEnd && distStartPx > handleTol && distEndPx > handleTol) {
            timelineDrag = 'trim-move';
            stoppedAtTrimEnd = false;
            trimMoveState = { trimStart0: trimStart, trimEnd0: trimEnd, x0: e.clientX };
            timelineTrack.classList.add('is-dragging');
        } else {
            beginScrubDrag(t);
        }
        try {
            timelineTrack.setPointerCapture(e.pointerId);
        } catch (_) {}
    });

    timelineTrack.addEventListener('pointermove', e => {
        if (!timelineDrag) return;
        const d = getDuration();
        if (!d) return;
        const t = timeFromClientX(e.clientX);

        if (timelineDrag === 'seek') {
            stoppedAtTrimEnd = false;
            video.currentTime = t;
            document.getElementById('time-current').textContent = formatTime(t);
            layoutTimeline();
            return;
        }
        if (timelineDrag === 'trim-start') {
            stoppedAtTrimEnd = false;
            trimStart = Math.max(0, Math.min(t, trimEnd - MIN_TRIM_SEC));
            syncTrimUI();
            return;
        }
        if (timelineDrag === 'trim-end') {
            stoppedAtTrimEnd = false;
            trimEnd = Math.min(d, Math.max(t, trimStart + MIN_TRIM_SEC));
            syncTrimUI();
            return;
        }
        if (timelineDrag === 'trim-move' && trimMoveState) {
            stoppedAtTrimEnd = false;
            const r = timelineTrack.getBoundingClientRect();
            const pxPerSec = r.width / d;
            const deltaT = (e.clientX - trimMoveState.x0) / pxPerSec;
            const span = trimMoveState.trimEnd0 - trimMoveState.trimStart0;
            let newStart = trimMoveState.trimStart0 + deltaT;
            let newEnd = trimMoveState.trimEnd0 + deltaT;
            if (newStart < 0) {
                newStart = 0;
                newEnd = span;
            }
            if (newEnd > d) {
                newEnd = d;
                newStart = Math.max(0, d - span);
            }
            trimStart = newStart;
            trimEnd = newEnd;
            syncTrimUI();
        }
    });

    timelineTrack.addEventListener('pointerup', endTimelineDrag);
    timelineTrack.addEventListener('pointercancel', endTimelineDrag);
    timelineTrack.addEventListener('lostpointercapture', () => {
        timelineDrag = null;
        trimMoveState = null;
        timelineTrack.classList.remove('is-dragging');
        seeking = false;
        updatePlayheadOnly();
        document.getElementById('time-current').textContent = formatTime(getPlayheadTimelineSeconds());
    });

    video.addEventListener('timeupdate', () => {
        if (seeking) return;
        if (!video.paused) return;
        updatePlayheadOnly();
        document.getElementById('time-current').textContent = formatTime(getPlayheadTimelineSeconds());
    });

    video.addEventListener('play', () => {
        syncVideoPlayButton();
        startPlayheadRaf();
    });

    video.addEventListener('pause', () => {
        syncVideoPlayButton();
        stopPlayheadRaf();
        if (video.currentTime > trimEnd) video.currentTime = trimEnd;
        updatePlayheadOnly();
        document.getElementById('time-current').textContent = formatTime(getPlayheadTimelineSeconds());
    });

    video.addEventListener('loadedmetadata', () => {
        document.getElementById('time-total').textContent = formatTime(video.duration);
        layoutTimeline();
    });

    window.addEventListener('resize', () => {
        layoutTimeline();
        layoutCropCanvas();
    });

    function togglePlay() {
        if (cropActive) return;
        if (video.paused) {
            if (video.currentTime < trimStart) video.currentTime = trimStart;
            if (stoppedAtTrimEnd || video.currentTime >= trimEnd - TRIM_END_EPS) video.currentTime = trimStart;
            stoppedAtTrimEnd = false;
            video.play();
        } else {
            video.pause();
        }
        syncVideoPlayButton();
    }

    function onTrimInput() {
        const d = getDuration() || 0;
        if (!d) return;
        stoppedAtTrimEnd = false;
        trimStart = Math.max(0, parseFloat(document.getElementById('trim-start').value) || 0);
        trimEnd = Math.min(d, parseFloat(document.getElementById('trim-end').value) || d);
        if (trimEnd < trimStart + MIN_TRIM_SEC) trimEnd = Math.min(d, trimStart + MIN_TRIM_SEC);
        syncTrimUI();
    }

    function syncTrimUI() {
        document.getElementById('trim-start').value = formatTimePrecise(trimStart);
        document.getElementById('trim-end').value = formatTimePrecise(trimEnd);
        const dur = trimEnd - trimStart;
        document.getElementById('trim-duration').textContent = `(${formatTime(dur)})`;
        layoutTimeline();
    }

    function toggleAudio() {
        video.muted = !document.getElementById('chk-audio').checked;
    }

    function toggleLock() {
        lockRatio = !lockRatio;
        document.getElementById('lock-ratio').textContent = lockRatio ? '[=]' : '[/]';
    }

    function onResizeW() {
        const eff = getEffectiveDimensions();
        const w = parseInt(document.getElementById('resize-w').value) || eff.w;
        if (lockRatio && eff.w) {
            const h = Math.round(w * eff.h / eff.w);
            document.getElementById('resize-h').value = h;
        }
    }

    function onResizeH() {
        const eff = getEffectiveDimensions();
        const h = parseInt(document.getElementById('resize-h').value) || eff.h;
        if (lockRatio && eff.h) {
            const w = Math.round(h * eff.w / eff.h);
            document.getElementById('resize-w').value = w;
        }
    }

    function resetSize() {
        syncResizeFromEffective();
    }

    function resetSession() {
        trimStart = 0;
        trimEnd = video.duration;
        stoppedAtTrimEnd = false;
        stopPlayheadRaf();
        videoCrop = null;
        exitVideoCropMode();
        video.style.clipPath = '';
        syncTrimUI();
        document.getElementById('resize-w').value = originalW;
        document.getElementById('resize-h').value = originalH;
        document.getElementById('chk-audio').checked = true;
        video.muted = false;
        video.currentTime = 0;
    }

    function closeEditor() {
        stopPlayheadRaf();
        stoppedAtTrimEnd = false;
        videoCrop = null;
        exitVideoCropMode();
        video.style.clipPath = '';
        if (ffmpeg) {
            try { ffmpeg.terminate(); } catch (_) {}
            ffmpeg = null;
        }
        if (video.src) URL.revokeObjectURL(video.src);
        video.removeAttribute('src');
        video.load();
        originalFile = null;
        originalW = 0;
        originalH = 0;
        document.getElementById('editor-window').classList.remove('is-open');
        document.getElementById('editor-title').textContent = I18n.t('video.editorTitle');
        syncVideoPlayButton();
        hideProgress();
    }

    function updateInfo() {
        const bar = document.getElementById('info-row');
        const size = originalFile ? (originalFile.size / 1024 / 1024).toFixed(1) + ' MB' : '—';
        const ext = originalFile ? originalFile.name.split('.').pop().toUpperCase() : '—';
        const dash = '\u2014';
        const eff = getEffectiveDimensions();
        const resLabel = videoCrop
            ? `${eff.w}\u00d7${eff.h} (${originalW}\u00d7${originalH})`
            : `${originalW}\u00d7${originalH}`;
        bar.innerHTML = `
            <span><span class="label">${I18n.t('video.labelFile')}</span> <b>${originalFile ? originalFile.name : dash}</b></span>
            <span><span class="label">${I18n.t('video.labelSizeInfo')}</span> <b>${size}</b></span>
            <span><span class="label">${I18n.t('video.labelFormat')}</span> <b>${ext}</b></span>
            <span><span class="label">${I18n.t('video.labelResolution')}</span> <b>${resLabel}</b></span>
            <span><span class="label">${I18n.t('video.labelDuration')}</span> <b>${formatTime(video.duration)}</b></span>
        `;
    }

    async function exportVideo() {
        if (!originalFile) {
            alert(I18n.t('video.alertNoVideo'));
            return;
        }
        if (cropActive) {
            alert(I18n.t('video.alertCropPending'));
            return;
        }

        const outW = Math.max(2, (parseInt(document.getElementById('resize-w').value, 10) || getEffectiveDimensions().w) & ~1);
        const outH = Math.max(2, (parseInt(document.getElementById('resize-h').value, 10) || getEffectiveDimensions().h) & ~1);
        const keepAudio = document.getElementById('chk-audio').checked;
        const start = Math.max(0, trimStart);
        const end = Math.min(video.duration || trimEnd, trimEnd);
        if (!(end > start)) {
            alert(I18n.t('video.alertTrimOrder'));
            return;
        }
        const duration = end - start;
        const baseName = originalFile.name.replace(/\.[^.]+$/, '') || 'video';
        const crop = getSourceCrop();
        const cropX = Math.max(0, crop.x) & ~1;
        const cropY = Math.max(0, crop.y) & ~1;
        const cropW = Math.max(2, crop.w) & ~1;
        const cropH = Math.max(2, crop.h) & ~1;
        const vfParts = [];
        if (videoCrop) {
            vfParts.push(`crop=${cropW}:${cropH}:${cropX}:${cropY}`);
        }
        vfParts.push(`scale=${outW}:${outH}`);
        const vf = vfParts.join(',');

        let saveHandle = null;
        if (window.showSaveFilePicker) {
            try {
                saveHandle = await window.showSaveFilePicker({
                    suggestedName: baseName + '.mp4',
                    types: [{ description: I18n.t('video.mp4Video'), accept: { 'video/mp4': ['.mp4'] } }]
                });
            } catch (e) {
                if (e.name === 'AbortError') return;
            }
        }

        try {
            const ff = await loadFFmpeg();
            ffmpegProgressLabelKey = 'video.exporting';

            let bytes;
            try {
                bytes = await readVideoBytesForExport();
            } catch (readErr) {
                console.error(readErr);
                alert(I18n.t('video.alertReadFail'));
                hideProgress();
                return;
            }
            if (!bytes || !bytes.byteLength) {
                alert(I18n.t('video.alertEmpty'));
                hideProgress();
                return;
            }

            try { await ff.deleteFile('input'); } catch (_) {}
            try { await ff.deleteFile('output.mp4'); } catch (_) {}

            showProgress(I18n.t('video.readingFile'), 5);
            await ff.writeFile('input', bytes);

            const args = [
                '-ss', String(start),
                '-i', 'input',
                '-t', String(duration),
                '-vf', vf,
                '-c:v', 'libx264', '-preset', 'fast', '-crf', '23',
                '-movflags', '+faststart',
            ];
            if (keepAudio) {
                args.push('-c:a', 'aac', '-b:a', '128k');
            } else {
                args.push('-an');
            }
            args.push('output.mp4');

            await ff.exec(args);

            let data;
            try {
                data = await ff.readFile('output.mp4');
            } catch (readOutErr) {
                console.error(readOutErr);
                alert(I18n.t('video.alertExportNotCreated'));
                try { await ff.deleteFile('input'); } catch (_) {}
                try { await ff.deleteFile('output.mp4'); } catch (_) {}
                hideProgress();
                return;
            }

            try { await ff.deleteFile('input'); } catch (_) {}
            try { await ff.deleteFile('output.mp4'); } catch (_) {}

            if (!data || !data.byteLength) {
                alert(I18n.t('video.alertExportEmpty'));
                hideProgress();
                return;
            }

            const blob = new Blob([data], { type: 'video/mp4' });

            if (saveHandle) {
                const writable = await saveHandle.createWritable();
                await writable.write(blob);
                await writable.close();
            } else {
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = baseName + '.mp4';
                a.click();
                setTimeout(() => URL.revokeObjectURL(a.href), 5000);
            }
        } catch (e) {
            console.error('Export failed:', e);
            const msg = (e && e.message) ? e.message : String(e);
            alert(I18n.t('video.alertExportPrefix') + msg);
        }
        hideProgress();
    }

    async function bootVideoI18n() {
        await I18n.init();
        I18n.applyTo(document.body);
        document.title = I18n.t('video.pageTitle');
        const et = document.getElementById('editor-title');
        if (et && !originalFile) et.textContent = I18n.t('video.editorTitle');
        syncVideoPlayButton();
        window.addEventListener('message', (e) => {
            const d = e.data;
            if (!d || d.type !== I18n.MSG_TYPE) return;
            if (d.lang !== 'en' && d.lang !== 'ru') return;
            I18n.setLang(d.lang).then(() => {
                I18n.applyTo(document.body);
                document.title = I18n.t('video.pageTitle');
                const titleEl = document.getElementById('editor-title');
                if (titleEl) {
                    titleEl.textContent = originalFile ? originalFile.name : I18n.t('video.editorTitle');
                }
                updateInfo();
                syncVideoPlayButton();
            });
        });
    }
    bootVideoI18n();
</script>
</body>
</html>
